[build]
  command = "npm run verify"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Nuxt's static output is a prerendered shell, so every unknown path serves the
# shell and the client router resolves it. That is the correct SPA fallback; it
# is not a rewrite for missing assets, which must still 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Content-hashed filenames are safe to keep forever.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Derivative images are named by width, not by content hash, so they are
# revalidated rather than pinned.
[[headers]]
  for = "/items/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# The prerendered shell must never be served from a stale cache, or a deploy
# that changes markup can keep serving the previous build.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
